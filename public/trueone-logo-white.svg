<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 281" width="100%" height="100%">
  <defs>
    <!-- Top-Right Petal: Blue -->
    <linearGradient id="pet-tr-outer-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168bfd" />
      <stop offset="100%" stop-color="#0f74e6" />
    </linearGradient>
    <linearGradient id="pet-tr-inner-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e62d4" />
      <stop offset="100%" stop-color="#0a4ea8" />
    </linearGradient>

    <!-- Bottom-Right Petal: Yellow -->
    <linearGradient id="pet-br-outer-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cb1b" />
      <stop offset="100%" stop-color="#eab910" />
    </linearGradient>
    <linearGradient id="pet-br-inner-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d69a08" />
      <stop offset="100%" stop-color="#b87f00" />
    </linearGradient>

    <!-- Bottom-Left Petal: Royal Blue -->
    <linearGradient id="pet-bl-outer-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1278e9" />
      <stop offset="100%" stop-color="#0b63c7" />
    </linearGradient>
    <linearGradient id="pet-bl-inner-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0951af" />
      <stop offset="100%" stop-color="#063d86" />
    </linearGradient>

    <!-- Top-Left Petal: Mint Teal -->
    <linearGradient id="pet-tl-outer-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2cd2bc" />
      <stop offset="100%" stop-color="#1bc0a6" />
    </linearGradient>
    <linearGradient id="pet-tl-inner-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#139a85" />
      <stop offset="100%" stop-color="#0a7565" />
    </linearGradient>
  </defs>

  <!-- 1. LEFT CLOVER / PINWHEEL ICON (Centered at x=135, y=144) -->
  <g transform="translate(135, 144)">
    <!-- Top-Right Petal (Blue) -->
    <g>
      <path d="M 0,-92 C 34,-92 68,-78 80,-44 L 25,-12 L 8,-25 Z" fill="url(#pet-tr-outer-w)" />
      <path d="M 80,-44 L 68,0 L 28,-8 L 25,-12 Z" fill="url(#pet-tr-inner-w)" />
    </g>

    <!-- Bottom-Right Petal (Yellow) -->
    <g transform="rotate(90)">
      <path d="M 0,-92 C 34,-92 68,-78 80,-44 L 25,-12 L 8,-25 Z" fill="url(#pet-br-outer-w)" />
      <path d="M 80,-44 L 68,0 L 28,-8 L 25,-12 Z" fill="url(#pet-br-inner-w)" />
    </g>

    <!-- Bottom-Left Petal (Royal Blue) -->
    <g transform="rotate(180)">
      <path d="M 0,-92 C 34,-92 68,-78 80,-44 L 25,-12 L 8,-25 Z" fill="url(#pet-bl-outer-w)" />
      <path d="M 80,-44 L 68,0 L 28,-8 L 25,-12 Z" fill="url(#pet-bl-inner-w)" />
    </g>

    <!-- Top-Left Petal (Mint Teal) -->
    <g transform="rotate(270)">
      <path d="M 0,-92 C 34,-92 68,-78 80,-44 L 25,-12 L 8,-25 Z" fill="url(#pet-tl-outer-w)" />
      <path d="M 80,-44 L 68,0 L 28,-8 L 25,-12 Z" fill="url(#pet-tl-inner-w)" />
    </g>
  </g>

  <!-- 2. TYPOGRAPHY: "True" (Pure White) -->
  <text x="265" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="162" font-weight="900" fill="#ffffff" letter-spacing="-3">True</text>

  <!-- 3. CYCLICAL 'O' RING (Centered at x=672, y=144) -->
  <g transform="translate(672, 144)">
    <path d="M -43.8,-43.8 A 62 62 0 0 1 43.8,-43.8 L 24,-24 A 34 34 0 0 0 -24,-24 Z" fill="#06c066" />
    <circle cx="-33.9" cy="-33.9" r="14" fill="#06c066" />

    <path d="M 43.8,-43.8 A 62 62 0 0 1 43.8,43.8 L 24,24 A 34 34 0 0 0 24,-24 Z" fill="#1788f8" />
    <circle cx="33.9" cy="-33.9" r="14" fill="#1788f8" />

    <path d="M 43.8,43.8 A 62 62 0 0 1 -43.8,43.8 L -24,24 A 34 34 0 0 0 24,24 Z" fill="#1cd0c2" />
    <circle cx="33.9" cy="33.9" r="14" fill="#1cd0c2" />

    <path d="M -43.8,43.8 A 62 62 0 0 1 -43.8,-43.8 L -24,-24 A 34 34 0 0 0 -24,24 Z" fill="#f1ca1f" />
    <circle cx="-33.9" cy="33.9" r="14" fill="#f1ca1f" />
  </g>

  <!-- 4. TYPOGRAPHY: "ne" (Pure White, Tightened to x=744) -->
  <text x="744" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="162" font-weight="900" fill="#ffffff" letter-spacing="-3">ne</text>
</svg>
